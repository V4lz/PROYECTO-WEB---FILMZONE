<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Información</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background-color: #1f1f1f;
    color: white;
    text-align: center;
}

/* CONTENEDOR GENERAL */
.container {
    padding: 40px;
}

/* VIDEO */
.video {
    margin: 20px auto;
    width: 70%;
    max-width: 800px;
}

.video iframe {
    width: 100%;
    height: 450px;
    border-radius: 10px;
}

/* TITULO */
h1 {
    font-size: 50px;
    margin-top: 20px;
}

/* DESCRIPCIÓN */
.descripcion {
    margin-top: 20px;
    font-size: 18px;
    line-height: 1.6;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
}

/* BOTÓN VOLVER */
.btn {
    margin-top: 30px;
    padding: 10px 20px;
    background-color: red;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

.btn:hover {
    background-color: darkred;
}
</style>
</head>

<body>

<div class="container">

    

    <!-- VIDEO -->
    <div class="video">
        <!-- PON AQUÍ TU LINK DE YOUTUBE (EMBED) -->
        <iframe width="560" height="315" src="https://www.youtube.com/embed/l96zmDlWCBk?si=Yn8NKDFBzkFej2s4" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <!-- TITULO -->
    <h1>Chainsaw Man</h1>

    <!-- DESCRIPCIÓN -->
    <div class="descripcion">
        Chainsaw Man es una serie de manga japonesa escrita e ilustrada por Tatsuki Fujimoto. Se caracteriza por ser una obra de fantasía oscura, acción y comedia negra, ambientada en un mundo donde los miedos humanos cobran vida en forma de peligrosos demonios.
    </div>

    <!-- BOTÓN VOLVER (YA FUNCIONAL) -->
    <a href="../filmzone.html">
        <button class="btn">⬅ Volver</button>
    </a>

</div>

</body>
</html>
