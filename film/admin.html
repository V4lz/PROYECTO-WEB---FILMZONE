
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><title>Admin FILMZONE</title><style>
body{margin:0;font-family:Arial;background:#1f1f1f;color:white}header{display:flex;align-items:center;padding:10px 20px;background:#141414}.logo{color:red;font-size:28px;font-weight:bold;margin-right:30px}a{color:white}.wrap{padding:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#141414;padding:18px;border-radius:8px}input,textarea,select{width:100%;box-sizing:border-box;margin:6px 0;padding:9px;background:#333;color:white;border:1px solid #555}.btn{padding:9px 14px;background:red;color:white;border:none;cursor:pointer;margin-top:8px}.item{border-bottom:1px solid #333;padding:10px 0}.small{font-size:13px;color:#bbb}.danger{background:#8a0000}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style><meta content="width=device-width, initial-scale=1.0" name="viewport"/></head><body><header><div class="logo">FILMZONE Admin</div><a href="filmzone.html">Volver al catálogo</a></header><div class="wrap"><p id="msg"></p><div class="grid"><div class="panel"><h2>Crear categoría</h2><input id="catNombre" placeholder="Nombre"/><button class="btn" onclick="crearCategoria()">Guardar</button><h2>Categorías</h2><div id="categorias"></div></div><div class="panel"><h2>Usuarios</h2><div id="usuarios"></div></div></div><div class="panel" style="margin-top:20px"><h2>Agregar película o serie</h2><select id="tipo"><option value="movie">Película</option><option value="series">Serie</option></select><input id="titulo" placeholder="Título"/><textarea id="descripcion" placeholder="Descripción"></textarea><input id="fecha" type="date"/><select id="categoria"></select><input id="trailer" placeholder="URL trailer YouTube/embed"/><input id="imagen" placeholder="URL imagen portada"/><button class="btn" onclick="crearContenido()">Guardar contenido</button></div><div class="grid" style="margin-top:20px"><div class="panel"><h2>Películas</h2><div id="movies"></div></div><div class="panel"><h2>Series</h2><div id="series"></div></div></div></div>
<script src="app.js"></script><script>
if(!token()) location.href='login.html'; const user=JSON.parse(localStorage.getItem('usuario')||'{}'); if(user.tipo_usuario!=='admin') location.href='filmzone.html';
function msg(t){document.getElementById('msg').textContent=t;}
async function cargar(){
 const [cats,users,movies,series]=await Promise.all([fetch('/categories').then(r=>r.json()),fetch('/users',{headers:headers()}).then(r=>r.json()),fetch('/movies').then(r=>r.json()),fetch('/series').then(r=>r.json())]);
 document.getElementById('categoria').innerHTML=cats.map(c=>`<option value="${c._id}">${c.nombre}</option>`).join(''); document.getElementById('categorias').innerHTML=cats.map(c=>`<div class="item">${c.nombre} <button class="btn" onclick="editarCategoria('${c._id}','${escapeAttr(c.nombre)}')">Editar</button> <button class="btn danger" onclick="borrar('/admin/categories/${c._id}')">Eliminar</button></div>`).join('');
 document.getElementById('usuarios').innerHTML=users.map(u=>`<div class="item"><b>${u.nombre}</b><div class="small">${u.email}</div><select onchange="cambiarRol('${u._id}',this.value)"><option value="user" ${u.tipo_usuario==='user'?'selected':''}>user</option><option value="admin" ${u.tipo_usuario==='admin'?'selected':''}>admin</option></select><button class="btn danger" onclick="eliminarUsuario('${u._id}')">Eliminar usuario</button></div>`).join('');
 document.getElementById('movies').innerHTML=movies.map(x=>item(x,'movies')).join(''); document.getElementById('series').innerHTML=series.map(x=>item(x,'series')).join('');
}
function escapeAttr(valor){return String(valor||'').replace(/'/g, '&#39;').replace(/\"/g, '&quot;');}
function item(x,t){return `<div class="item"><b>${x.titulo}</b><div class="small">${x.categoria?.nombre||''}</div><button class="btn" onclick="editarContenido('${t}','${x._id}')">Editar</button> <button class="btn danger" onclick="borrar('/admin/${t}/${x._id}')">Eliminar</button></div>`}
async function crearCategoria(){const nombre=document.getElementById('catNombre').value.trim(); if(!nombre)return; await fetch('/admin/categories',{method:'POST',headers:headers(),body:JSON.stringify({nombre})}); document.getElementById('catNombre').value=''; msg('Categoría guardada'); cargar();}
async function editarCategoria(id,nombreActual){const nombre=prompt('Nuevo nombre de la categoría:',nombreActual); if(!nombre||!nombre.trim())return; const res=await fetch('/admin/categories/'+id,{method:'PUT',headers:headers(),body:JSON.stringify({nombre:nombre.trim()})}); msg(res.ok?'Categoría actualizada':'No se pudo actualizar la categoría'); cargar();}
async function crearContenido(){const tipo=document.getElementById('tipo').value; const body={titulo:titulo.value,descripcion:descripcion.value,fecha_estreno:fecha.value,categoria:categoria.value,url_trailer:trailer.value,imagen_portada:imagen.value}; const url=tipo==='movie'?'/admin/movies':'/admin/series'; const res=await fetch(url,{method:'POST',headers:headers(),body:JSON.stringify(body)}); msg(res.ok?'Contenido guardado':'No se pudo guardar'); cargar();}
async function editarContenido(tipo,id){const endpoint=tipo==='movies'?'/movies/':'/series/'; const adminEndpoint=tipo==='movies'?'/admin/movies/':'/admin/series/'; const actual=await fetch(endpoint+id).then(r=>r.json()); const nuevoTitulo=prompt('Título:',actual.titulo||''); if(nuevoTitulo===null)return; const nuevaDescripcion=prompt('Descripción:',actual.descripcion||''); if(nuevaDescripcion===null)return; const nuevaFecha=prompt('Fecha de estreno (AAAA-MM-DD):',actual.fecha_estreno?actual.fecha_estreno.substring(0,10):''); if(nuevaFecha===null)return; const nuevaCategoria=prompt('ID de categoría:',actual.categoria?._id||actual.categoria||''); if(nuevaCategoria===null)return; const nuevoTrailer=prompt('URL trailer:',actual.url_trailer||''); if(nuevoTrailer===null)return; const nuevaImagen=prompt('URL imagen portada:',actual.imagen_portada||''); if(nuevaImagen===null)return; const body={titulo:nuevoTitulo,descripcion:nuevaDescripcion,fecha_estreno:nuevaFecha,categoria:nuevaCategoria,url_trailer:nuevoTrailer,imagen_portada:nuevaImagen}; const res=await fetch(adminEndpoint+id,{method:'PUT',headers:headers(),body:JSON.stringify(body)}); msg(res.ok?'Contenido actualizado':'No se pudo actualizar el contenido'); cargar();}
async function borrar(url){if(!confirm('¿Eliminar?'))return; await fetch(url,{method:'DELETE',headers:headers()}); cargar();}
async function cambiarRol(id,tipo_usuario){await fetch('/users/'+id,{method:'PUT',headers:headers(),body:JSON.stringify({tipo_usuario})}); msg('Rol actualizado');}
async function eliminarUsuario(id){if(!confirm('¿Eliminar usuario?'))return; const res=await fetch('/users/'+id,{method:'DELETE',headers:headers()}); msg(res.ok?'Usuario eliminado':'No se pudo eliminar'); cargar();}
cargar();
</script></body></html>
